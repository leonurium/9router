name: Sync Upstream Releases

on:
  schedule:
    # Check upstream every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Manual trigger anytime

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout leonurium/9router
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Fetch upstream & check status
        id: sync
        run: |
          UPSTREAM="decolua/9router"
          OUR_REMOTE="origin"
          OUR_BRANCH="master"

          # Fetch upstream
          git remote add upstream "https://github.com/${UPSTREAM}.git" 2>/dev/null || true
          git fetch upstream --tags

          # Get latest upstream tag via GitHub API (more reliable than git ls-remote)
          UPSTREAM_TAG=$(curl -s "https://api.github.com/repos/${UPSTREAM}/releases/latest" | python3 -c "import sys,json; print(json.load(sys.stdin).get('tag_name','v0.0.0'))")
          echo "Upstream latest tag: ${UPSTREAM_TAG}"

          # Get current (leonurium) version from package.json
          CURRENT_VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          echo "Current leonurium version: ${CURRENT_VERSION}"

          # Compare versions
          python3 -c "
          from packaging import version
          current = version.parse('$CURRENT_VERSION')
          upstream = version.parse('${UPSTREAM_TAG}')
          new_version = '${UPSTREAM_TAG}'
          if current >= upstream:
              print('VERSION_SKIP=true')
              print(f'Version {current} >= {upstream} - no update needed')
          else:
              print('VERSION_SKIP=false')
              print(f'Version {current} < {upstream} - update required')
          print('UPSTREAM_TAG=${UPSTREAM_TAG}')
          print('NEW_VERSION=${UPSTREAM_TAG}')
          " >> $GITHUB_OUTPUT

      - name: Rebase leonurium onto upstream
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        run: |
          UPSTREAM="decolua/9router"
          git rebase upstream/master
          echo "REBASE_DONE=true" >> $GITHUB_OUTPUT

      - name: Force-push rebased code
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        run: |
          git push origin master --force-with-lease
          echo "PUSH_DONE=true" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/9router
          tags: |
            type=semver,pattern={{version}},value=${{ steps.sync.outputs.NEW_VERSION }}
            type=raw,value=latest

      - name: Build and push
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Create GitHub release
        if: steps.sync.outputs.VERSION_SKIP == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.sync.outputs.NEW_VERSION }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
